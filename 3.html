<!DOCTYPE html>
<html>
<head>
    <title>GPT College Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-image: url("college.jpg");
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 20px;
        }

        .container{
            width: 700px;
            margin: auto;
            background: rgba(255,255,255,0.85);
            padding: 20px;
            border: 3px solid #4B0082;
            border-radius: 10px;
            box-shadow: 0 0 15px black;
        }

        h1{
            text-align: center;
            color: darkblue;
        }

        label{
            font-weight: bold;
        }

        input[type=text],
        input[type=email],
        input[type=tel],
        select{
            width: 250px;
            height: 30px;
            border: 1px solid gray;
            border-radius: 5px;
            padding-left: 8px;
        }

        input[type=radio],
        input[type=checkbox]{
            margin: 5px;
        }

        img{
            width: 400px;
            height: 250px;
            display: block;
            margin: auto;
            border: 3px solid navy;
            border-radius: 10px;
        }

        a{
            color: blue;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover{
            color: red;
            text-decoration: underline;
        }

        input[type=submit],
        input[type=reset]{
            background: navy;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type=submit]:hover,
        input[type=reset]:hover{
            background: green;
        }
    </style>

</head>

<body>

<div class="container">

<h1>GPT COLLEGE KAMPLI</h1>

<form>

<label>Student Name:</label>
<input type="text" placeholder="Enter Name"><br><br>

<label>Reg No:</label>
<input type="text" placeholder="Enter Reg No"><br><br>

<label>Email:</label>
<input type="email" placeholder="Enter Email"><br><br>

<label>Phone No:</label>
<input type="tel" placeholder="Enter Phone Number"><br><br>

<label>Gender:</label>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Others

<br><br>

<label>Pathway:</label><br>

<input type="checkbox"> Full Stack Development<br>
<input type="checkbox"> AI & ML<br>
<input type="checkbox"> Cloud Computing<br>
<input type="checkbox"> Cyber Security<br><br>

<label>Branch:</label><br>

<input type="checkbox"> Computer Science<br>
<input type="checkbox"> Civil<br>
<input type="checkbox"> Mechanical<br>
<input type="checkbox"> E & C<br><br>

<label>Year:</label><br>

<input type="radio" name="year"> 1st Year<br>
<input type="radio" name="year"> 2nd Year<br>
<input type="radio" name="year"> 3rd Year<br><br>

<label>Semester:</label><br>

<select>
    <option>Select Semester</option>
    <option>1st Sem</option>
    <option>2nd Sem</option>
    <option>3rd Sem</option>
    <option>4th Sem</option>
    <option>5th Sem</option>
    <option>6th Sem</option>
</select>

<br><br>

<center>
<a href="https://www.gpt.karnataka.gov.in" target="_blank">
Visit Our College
</a>
</center>

<br>

<img src="image.jpg" alt="College Image">

<br>

<center>
<a href="4.html">submit</a>
>

</center>

</form>

</div>

</body>
</html>
